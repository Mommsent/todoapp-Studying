<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1 class="app-title">📋 Менеджер задач</h1>
            <nav>
                <button class="nav-btn active" data-link="tasks">
                    <i data-lucide="list-checks"></i> Задачи
                </button>
                <button class="nav-btn" data-link="users">
                    <i data-lucide="users"></i> Пользователи
                </button>
                <button class="nav-btn" data-link="statistics">
                    <i data-lucide="bar-chart-3"></i> Статистика
                </button>
            </nav>
            <div class="header-actions">
                <div id="notification" class="notification hidden"></div>
            </div>
        </header>

        <main id="main-content" class="main-content">
            <p> ABOBA</p>
        </main>

        <footer class="app-footer">
            <p>&copy; 2026 Todo App</p>
        </footer>
    </div>

    <noscript> У вас отключен JavaSkript </noscript>
    <script type="module" src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
